:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}

<style>
/* Layout: navy masthead with controls, then a stacked sheet: best windows → week heatmap → season strip → booking lead time → tips */
:root{
  --ta-blue:#006BFD; --ta-navy:#122634; --ta-orange:#D14900; --ta-yellow:#FCC71D; --ta-green:#17AA3D;
  --bg:#F3F6FA; --surface:#FFFFFF; --fg:#122634; --muted:#5A6573; --line:#DCE3EC;
  --heat0:#EDF2F8; --heat-ink:#122634; --accent:var(--ta-blue); --hot:var(--ta-orange);
  --band:#122634; --band-fg:#FFFFFF; --band-muted:#A9BACB; --chip:#1E3a4E; --chip-on:#FFFFFF; --chip-on-fg:#122634;
  --display:"Outfit", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1B26; --surface:#14283A; --fg:#E8EEF4; --muted:#9AAABB; --line:#24394D;
  --heat0:#1A3044; --heat-ink:#E8EEF4; --accent:#4B95FF; --hot:#FF7A33;
  --band:#081520; --band-fg:#FFFFFF; --band-muted:#8FA3B8; --chip:#18303F; --chip-on:#FFFFFF; --chip-on-fg:#122634; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1B26; --surface:#14283A; --fg:#E8EEF4; --muted:#9AAABB; --line:#24394D;
  --heat0:#1A3044; --heat-ink:#E8EEF4; --accent:#4B95FF; --hot:#FF7A33;
  --band:#081520; --band-fg:#FFFFFF; --band-muted:#8FA3B8; --chip:#18303F; --chip-on:#FFFFFF; --chip-on-fg:#122634; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.eyebrow{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
button,select{font:inherit}
:focus-visible{outline:3px solid var(--ta-yellow);outline-offset:2px}

/* Masthead */
.mast{background:var(--band);color:var(--band-fg);position:relative;overflow:hidden}
.mast .wrap{padding-block:28px 30px;display:grid;gap:22px;position:relative}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{height:28px;width:auto;display:block;max-width:100%}
.brand-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.uilang{display:inline-flex;background:var(--chip);border:1px solid #2E4A60;border-radius:999px;padding:3px}
.uilang button{border:0;background:transparent;color:var(--band-fg);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;cursor:pointer;min-height:34px;font-family:var(--display)}
.uilang button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-fg)}
.mast .eyebrow{color:var(--band-muted)}
.hello{font-family:var(--display);font-weight:700;color:var(--ta-yellow);font-size:clamp(20px,3vw,26px);min-height:1.3em}
.mast h1{font-size:clamp(34px,6vw,58px);line-height:1.02;font-weight:800;max-width:19ch}
.mast h1 em{font-style:normal;color:#6FAEFF}
.lede{color:#D5DFE9;max-width:60ch;margin:0}
.bubble{position:absolute;right:-60px;top:-40px;width:340px;height:260px;border-radius:50% 50% 50% 8px;border:2px solid rgba(255,255,255,.07);pointer-events:none}
.bubble.b2{right:60px;top:110px;width:180px;height:130px;border-color:rgba(209,73,0,.35)}
.controls{display:grid;gap:14px}
.ctl-label{font-size:13px;color:var(--band-muted);font-weight:600;margin-bottom:6px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid #2E4A60;background:var(--chip);color:var(--band-fg);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:15px;min-height:40px}
.chip:hover{border-color:#6FAEFF}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-fg);border-color:var(--chip-on)}
.tzrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select{background:var(--chip);color:var(--band-fg);border:1px solid #2E4A60;border-radius:10px;padding:9px 12px;min-height:42px;max-width:100%}
.clock{font-size:14px;color:var(--band-muted)}

/* Sheet */
main .wrap{padding-block:28px 48px;display:grid;gap:28px}
section{display:grid;gap:14px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-head h2{font-size:clamp(22px,3vw,28px);font-weight:700}
.sec-head p{margin:0;color:var(--muted);font-size:15px;max-width:60ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.note{font-size:14px;color:var(--muted);margin:0}
.warn[hidden]{display:none}
.warn{display:inline-flex;gap:8px;align-items:center;background:color-mix(in srgb,var(--ta-yellow) 22%,var(--surface));border:1px solid color-mix(in srgb,var(--ta-yellow) 60%,var(--line));border-radius:10px;padding:8px 12px;font-size:14px}

/* Best windows */
.windows{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.win{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;display:grid;gap:6px;align-content:start;position:relative}
.win .rank{font-family:var(--display);font-weight:700;font-size:13px;color:var(--hot);letter-spacing:.08em;text-transform:uppercase}
.win .day{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.1}
.win .time{font-family:var(--display);font-weight:600;font-size:20px;color:var(--accent);font-variant-numeric:tabular-nums}
.win .why{font-size:14px;color:var(--muted)}
.win:first-child{border-color:var(--hot);box-shadow:0 0 0 1px var(--hot) inset}
.facts{display:flex;flex-wrap:wrap;gap:10px 22px;font-size:15px}
.facts b{font-family:var(--display)}

/* Heatmap */
.heat-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.heat{display:grid;grid-template-columns:52px repeat(var(--cols),minmax(26px,1fr));gap:3px;min-width:calc(52px + var(--cols) * 29px);font-variant-numeric:tabular-nums}
.heat .hl{font-size:12px;color:var(--muted);text-align:center;white-space:nowrap;align-self:end;padding-bottom:2px}
.heat .dl{font-family:var(--display);font-weight:600;font-size:14px;align-self:center}
.cell{aspect-ratio:1/1;border-radius:5px;background:var(--heat0);position:relative;border:0;padding:0;cursor:default;max-width:100%}
.cell.peak::after{content:"";position:absolute;inset:auto 3px 3px auto;width:6px;height:6px;border-radius:50%;background:var(--hot);box-shadow:0 0 0 1.5px var(--surface)}
.cell:hover,.cell:focus-visible{outline:2px solid var(--fg);outline-offset:1px;z-index:1}
.legend{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.ramp{display:flex;gap:3px;align-items:center}
.ramp i{width:18px;height:12px;border-radius:3px;display:block}
.pk{display:inline-flex;align-items:center;gap:6px}
.pk i{width:8px;height:8px;border-radius:50%;background:var(--hot);display:block}
.readout{min-height:1.5em;font-size:15px}
.readout b{font-family:var(--display)}

/* Season */
.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;align-items:end;height:150px}
.mcol{display:grid;grid-template-rows:1fr auto;height:100%;gap:6px;min-width:0}
.mbar{align-self:end;border-radius:6px 6px 2px 2px;background:color-mix(in srgb,var(--accent) 35%,var(--heat0));position:relative;min-height:4px}
.mbar.busy{background:var(--accent)}
.mbar.top{background:var(--hot)}
.mcol{cursor:default;outline:none}
.mval{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translate(-50%,4px);background:var(--fg);color:var(--bg);font-size:12px;font-weight:700;font-family:var(--display);padding:3px 7px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;z-index:2;font-variant-numeric:tabular-nums}
.mcol:hover .mval,.mcol:focus-visible .mval,.mcol.show .mval{opacity:1;transform:translate(-50%,0)}
.mcol:hover .mbar.now::before,.mcol:focus-visible .mbar.now::before,.mcol.show .mbar.now::before{opacity:0}
.mcol:hover .mbar,.mcol:focus-visible .mbar,.mcol.show .mbar{filter:brightness(1.12)}
.mcol:focus-visible .mlab{color:var(--fg);text-decoration:underline}
.mbar.now::before{content:attr(data-now);position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--fg);font-family:var(--display);white-space:nowrap}
.mlab{font-size:12px;text-align:center;color:var(--muted);font-family:var(--display);font-weight:600}
.mlab.now{color:var(--fg)}
.season-text{margin:0;font-size:16px}

/* Lead time */
.leadbar{display:flex;height:40px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.leadbar div{display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;min-width:0;overflow:hidden;white-space:nowrap}
.lkey{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted)}
.lkey span{display:inline-flex;gap:6px;align-items:center}
.lkey i{width:12px;height:12px;border-radius:3px;display:block}
.bigstat{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;color:var(--accent)}
.lead-grid{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}

/* Tips */
.tips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.tip{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start}
.tip svg{width:36px;height:36px}
.tip h3{font-size:18px;font-weight:700;margin-bottom:2px}
.tip p{margin:0;color:var(--muted);font-size:15px}
.tip .more{display:inline-block;margin-top:8px;font-weight:700;font-size:15px}
a{color:var(--accent);text-underline-offset:3px}
a:hover{color:var(--hot)}
.resources{display:flex;align-items:center;justify-content:space-between;gap:16px 24px;flex-wrap:wrap;background:var(--band);color:var(--band-fg);border-radius:16px;padding:22px 24px;position:relative;overflow:hidden}
.resources > div{display:grid;gap:4px;min-width:0;max-width:62ch}
.resources h3{font-size:22px;font-weight:700}
.resources p{margin:0;color:#D5DFE9;font-size:15px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--ta-blue);color:#FFFFFF;text-decoration:none;font-family:var(--display);font-weight:700;font-size:16px;border-radius:999px;padding:12px 22px;min-height:46px;white-space:nowrap}
.btn:hover{background:#FFFFFF;color:var(--ta-navy)}

footer .wrap{padding-block:0 40px}
footer p{font-size:13px;color:var(--muted);margin:0;max-width:80ch}

@media (max-width:760px){
  .windows{grid-template-columns:1fr}
  .tips{grid-template-columns:1fr}
  .months{height:120px;gap:3px}
  .mlab{font-size:10px}
  .lead-grid{grid-template-columns:1fr}
  .bubble{display:none}
}
@media (prefers-reduced-motion:no-preference){
  .cell,.mbar{transition:background-color .25s ease,height .35s ease}
  .mval{transition:opacity .15s ease,transform .15s ease}
}
</style>
</head>

  let h=(location.hash||"").slice(1).toLowerCase(); let ui=null;
  if(h==="es"||h.startsWith("es-")){ui="es"; h=h.slice(3);} else if(h==="en"||h.startsWith("en-")){ui="en"; h=h.slice(3);}
  return {ui, lang:isLang(h)?h:null};
}
{
  const h=readHash();
  state.ui = h.ui || store.get("cp-ui") || ((navigator.language||"").toLowerCase().startsWith("es")?"es":"en");
  if(state.ui!=="es") state.ui="en";
  state.lang = h.lang || (isLang(store.get("cp-lang"))?store.get("cp-lang"):"spanish");
  try{ state.tz = store.get("cp-tz") || Intl.DateTimeFormat().resolvedOptions().timeZone || "America/New_York"; }catch(e){}
}
const LOC=()=>state.ui==="es"?"es-419":"en-US";
const t=k=>T[state.ui][k];
function syncHash(){ const h=(state.ui==="es"?"es-":"")+state.lang; try{history.replaceState(null,"","#"+h)}catch(e){location.hash=h} }

/* ---------- time zone math ---------- */
function tzParts(date,tz){
  const f=new Intl.DateTimeFormat("en-US",{timeZone:tz,hourCycle:"h23",year:"numeric",month:"numeric",day:"numeric",hour:"numeric",minute:"numeric",weekday:"short"});
  const o={}; for(const p of f.formatToParts(date)) o[p.type]=p.value; return o;
}
function offsetMin(date,tz){
  const p=tzParts(date,tz);
  const asUTC=Date.UTC(+p.year,+p.month-1,+p.day,+p.hour%24,+p.minute);
  return Math.round((asUTC-Math.floor(date.getTime()/60000)*60000)/60000);
}
function etWallToDate(y,m,d,h){
  let guess=new Date(Date.UTC(y,m,d,h));
  for(let i=0;i<2;i++){ guess=new Date(Date.UTC(y,m,d,h)-offsetMin(guess,"America/New_York")*60000); }
  return guess;
}
const WD={Mon:0,Tue:1,Wed:2,Thu:3,Fri:4,Sat:5,Sun:6};
function refMonday(){
  const p=tzParts(new Date(),"America/New_York");
  const d=new Date(Date.UTC(+p.year,+p.month-1,+p.day));
  d.setUTCDate(d.getUTCDate()-WD[p.weekday]); return d;
}
function toLocal(grid,tz){
  const mon=refMonday(); const cells=Array.from({length:7},()=>Array(24).fill(0)); let minute=0;
  for(let dow=0;dow<7;dow++) for(let h=0;h<24;h++){
    const n=grid[dow*24+h]; const base=new Date(mon); base.setUTCDate(mon.getUTCDate()+dow);
    const inst=etWallToDate(base.getUTCFullYear(),base.getUTCMonth(),base.getUTCDate(),h);
    const p=tzParts(inst,tz); minute=+p.minute;
    cells[WD[p.weekday]][+p.hour%24]+=n;
  }
  return {cells,minute};
}
function fmtHour(h,minute){
  const d=new Date(Date.UTC(2026,0,5,h,minute));
  return new Intl.DateTimeFormat(LOC(),{hour:"numeric",minute:minute||state.ui==="es"?"2-digit":undefined,timeZone:"UTC"}).format(d).replace(/ | /g," ");
}
function fmtShortHour(h,minute){
  const d=new Date(Date.UTC(2026,0,5,h,minute));
  const s=new Intl.DateTimeFormat(LOC(),{hour:"numeric",minute:minute?"2-digit":undefined,timeZone:"UTC"}).format(d);
  return s.replace(/[\s  ]*([ap])\.?[\s  ]*m\.?/i,(m,x)=>x.toLowerCase());
}
const dayName=(i,len)=>cap(new Intl.DateTimeFormat(LOC(),{weekday:len,timeZone:"UTC"}).format(new Date(Date.UTC(2026,0,5+i))).replace(/\.$/,""));
const monthName=(i,len)=>cap(new Intl.DateTimeFormat(LOC(),{month:len,timeZone:"UTC"}).format(new Date(Date.UTC(2026,i,15))).replace(/\.$/,""));
const num=n=>n.toLocaleString(LOC());

/* ---------- controls ---------- */
const langsEl=document.getElementById("langs");
function buildChips(){
  langsEl.innerHTML="";
  const sorted=[...LANGS].sort((a,b)=>a[state.ui].localeCompare(b[state.ui],LOC()));
  for(const l of sorted){
    const b=document.createElement("button"); b.type="button"; b.className="chip"; b.id="lang-"+l.id; b.textContent=l[state.ui]; b.dataset.id=l.id;
    b.addEventListener("click",()=>{state.lang=l.id; store.set("cp-lang",l.id); syncHash(); render();});
    langsEl.appendChild(b);
  }
}
for(const b of document.querySelectorAll(".uilang button")){
  b.addEventListener("click",()=>{ state.ui=b.dataset.ui; store.set("cp-ui",state.ui); syncHash(); buildChips(); buildTz(); render(); });
}
window.addEventListener("hashchange",()=>{const h=readHash(); let ch=false;
  if(h.ui&&h.ui!==state.ui){state.ui=h.ui; ch=true;} if(h.lang&&h.lang!==state.lang){state.lang=h.lang; ch=true;}
  if(ch){buildChips(); buildTz(); render();}});

const tzSel=document.getElementById("tz");
let zones=[]; try{ zones=Intl.supportedValuesOf("timeZone"); }catch(e){}
if(!zones.length) zones=["America/New_York","America/Chicago","America/Denver","America/Los_Angeles","America/Mexico_City","America/Bogota","America/Lima","America/Santiago","America/Argentina/Buenos_Aires","America/Sao_Paulo","America/Caracas","America/Guatemala","America/Santo_Domingo","Europe/Madrid","Europe/Paris","Europe/Berlin","Europe/Rome","Europe/Lisbon","Europe/London","Europe/Moscow","Africa/Casablanca","Africa/Cairo","Asia/Amman","Asia/Riyadh","Asia/Tokyo","Asia/Shanghai","Asia/Taipei","Asia/Kolkata","Australia/Sydney"];
if(!zones.includes(state.tz)) zones.unshift(state.tz);
if(!zones.includes("America/New_York")) zones.unshift("America/New_York");
function buildTz(){
  const now=new Date(); const groups={}; tzSel.innerHTML="";
  for(const z of zones){ const g=z.includes("/")?z.split("/")[0]:"Other"; (groups[g]=groups[g]||[]).push(z); }
  for(const g of Object.keys(groups).sort()){
    const og=document.createElement("optgroup"); og.label=g;
    for(const z of groups[g]){
      let off=""; try{ const m=offsetMin(now,z); const s=m<0?"−":"+"; const a=Math.abs(m); off=` (UTC${s}${Math.floor(a/60)}${a%60?":"+String(a%60).padStart(2,"0"):""})`; }catch(e){}
      const o=document.createElement("option"); o.value=z; o.textContent=z.replace(/_/g," ").replace(/^[^/]+\//,"")+off; og.appendChild(o);
    }
    tzSel.appendChild(og);
  }
  tzSel.value=state.tz;
}
tzSel.addEventListener("change",()=>{state.tz=tzSel.value; store.set("cp-tz",state.tz); render();});

function tickClock(){
  try{ document.getElementById("clock").textContent=fill(t("clock"),{t:new Intl.DateTimeFormat(LOC(),{weekday:"short",hour:"numeric",minute:"2-digit",timeZone:state.tz}).format(new Date())}); }catch(e){}
}
setInterval(tickClock,30000);

function heatColor(v){
  if(v<=0) return "var(--heat0)";
  if(v>0.8) return `color-mix(in srgb, var(--ta-navy) ${Math.round((v-0.8)*250)}%, var(--accent))`;
  return `color-mix(in srgb, var(--accent) ${Math.round(18+v*82)}%, var(--heat0))`;
}
document.getElementById("ramp").innerHTML=[0.05,0.25,0.45,0.65,0.85,1].map(v=>`<i style="background:${heatColor(v)}"></i>`).join("");

/* ---------- render ---------- */
function render(){
  const L=LANGS.find(l=>l.id===state.lang);
  const lname = state.ui==="es" ? L.esIn : L.en;
  document.documentElement.lang=state.ui;
  for(const b of document.querySelectorAll(".uilang button")) b.setAttribute("aria-pressed",String(b.dataset.ui===state.ui));
  for(const el of document.querySelectorAll("[data-i]")) el.innerHTML=t(el.dataset.i);
  for(const b of langsEl.children) b.setAttribute("aria-pressed", String(b.dataset.id===state.lang));
  document.getElementById("hello").textContent=L.hi;
  document.getElementById("lede").textContent=fill(t("lede"),{lang:lname});
  tickClock();

  const grid=DATA.grid[L.id]; const total=grid.reduce((a,b)=>a+b,0);
  const warn=document.getElementById("smallWarn");
  warn.hidden = !DATA.small.includes(L.id);
  warn.textContent = t("small");
  const {cells,minute}=toLocal(grid,state.tz);
  const max=Math.max(...cells.flat());
  const pctFmt=x=>x>0&&x<0.1?"<0.1":x.toLocaleString(LOC(),{maximumFractionDigits:1,minimumFractionDigits:1});

  const hourTot=[...Array(24)].map((_,h)=>cells.reduce((a,r)=>a+r[h],0));
  let bestStart=0,bestLen=-1;
  for(let s=0;s<24;s++){ let len=0; while(len<24 && hourTot[(s+len)%24]===0) len++; if(len>bestLen){bestLen=len;bestStart=s;} }
  const first=(bestStart+bestLen)%24; const ncols=24-bestLen;
  const cols=[...Array(ncols)].map((_,i)=>(first+i)%24);

  const nz=cells.flat().filter(v=>v>0).sort((a,b)=>b-a);
  const peakCut=nz[Math.max(0,Math.floor(nz.length*0.1)-1)]||Infinity;

  const heat=document.getElementById("heat"); heat.style.setProperty("--cols",ncols);
  let html='<div></div>'+cols.map((h,i)=>`<div class="hl">${i%2===0?fmtShortHour(h,minute):""}</div>`).join("");
  for(let d=0;d<7;d++){
    html+=`<div class="dl">${dayName(d,"short")}</div>`;
    for(const h of cols){
      const v=cells[d][h]; const r=max?v/max:0;
      const label=fill(t("cellLabel"),{when:`${dayName(d,"long")} ${fmtHour(h,minute)}`,share:pctFmt(total?v/total*100:0)});
      html+=`<button type="button" class="cell${v>=peakCut&&v>0?" peak":""}" style="background:${heatColor(r)}" data-d="${d}" data-h="${h}" data-v="${v}" aria-label="${label}"></button>`;
    }
  }
  heat.innerHTML=html;
  const readout=document.getElementById("readout");
  const show=e=>{const c=e.target.closest(".cell"); if(!c) return; const d=+c.dataset.d,h=+c.dataset.h,v=+c.dataset.v;
    const share=total?v/total*100:0; const rel=max?Math.round(v/max*100):0;
    readout.innerHTML=fill(t("readout"),{when:`${dayName(d,"long")}, ${fmtHour(h,minute)}–${fmtHour((h+1)%24,minute)}`,lang:lname,share:pctFmt(share),
      rel: v===max&&v>0 ? t("relPeak") : v>0 ? fill(t("relOf"),{p:rel}) : ""});};
  heat.onmouseover=show; heat.onfocusin=show; heat.onclick=show;
  readout.textContent=fill(t("readout0"),{lang:lname});

  const etSame=(()=>{try{return offsetMin(new Date(),state.tz)===offsetMin(new Date(),"America/New_York")}catch(e){return false}})();
  document.getElementById("tzNote").textContent = etSame ? t("tzSame") : t("tzConv");

  // best 3-hour windows
  const blocks=[];
  for(let d=0;d<7;d++) for(let i=0;i<cols.length-2;i++){
    blocks.push({d,h:cols[i],sum:cells[d][cols[i]]+cells[d][cols[i+1]]+cells[d][cols[i+2]]});
  }
  blocks.sort((a,b)=>b.sum-a.sum);
  const picks=[];
  const dist=(a,b)=>{const x=Math.abs(a-b)%24; return Math.min(x,24-x);};
  const clash=b=>picks.some(p=>p.d===b.d && dist(p.h,b.h)<3);
  for(const b of blocks){ if(picks.length===3) break; if(b.sum>0 && !picks.some(p=>p.d===b.d)) picks.push(b); }
  for(const b of blocks){ if(picks.length===3) break; if(b.sum>0 && !picks.includes(b) && !clash(b)) picks.push(b); }
  picks.sort((a,b)=>b.sum-a.sum);
  const avgBlock = total/(7*ncols/3);
  document.getElementById("windows").innerHTML=picks.map((p,i)=>`
    <div class="win"><span class="rank">${t("ranks")[i]}</span>
      <span class="day">${dayName(p.d,"long")}</span>
      <span class="time">${fmtHour(p.h,minute)} – ${fmtHour((p.h+3)%24,minute)}</span>
      <span class="why">${fill(t("why"),{x:(p.sum/avgBlock).toLocaleString(LOC(),{maximumFractionDigits:1,minimumFractionDigits:1})})}</span>
    </div>`).join("");

  const dayTot=cells.map(r=>r.reduce((a,b)=>a+b,0));
  const busiest=dayTot.indexOf(Math.max(...dayTot)), quietest=dayTot.indexOf(Math.min(...dayTot));
  const wkend=(dayTot[5]+dayTot[6])/total*100;
  const peakHour=hourTot.indexOf(Math.max(...hourTot));
  document.getElementById("facts").innerHTML=
    `<span>${t("busiest")}: <b>${dayName(busiest,"long")}</b></span>`+
    `<span>${t("quietest")}: <b>${dayName(quietest,"long")}</b></span>`+
    `<span>${t("busyHour")}: <b>${fmtHour(peakHour,minute)}</b></span>`+
    `<span>${fill(t("weekends"),{p:Math.round(wkend)})}</span>`;

  // season
  const m=DATA.monthly[L.id]; const mmax=Math.max(...m)||1; const msum=m.reduce((a,b)=>a+b,0)||1;
  const curM=+tzParts(new Date(),state.tz).month-1;
  const sorted=[...m].map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v);
  const top3=new Set(sorted.slice(0,3).map(x=>x.i));
  document.getElementById("months").innerHTML=m.map((v,i)=>{
    const hgt=Math.max(3,Math.round(v/mmax*100));
    const cls=top3.has(i)?"top":(v>=mmax*0.5?"busy":"");
    return `<div class="mcol" tabindex="0" role="img" aria-label="${fill(t("monthTip"),{m:monthName(i,"long"),p:Math.round(v/msum*100)})}"><div class="mbar ${cls}${i===curM?" now":""}" data-now="${t("now")}" style="height:${hgt}%"><span class="mval" aria-hidden="true">${Math.round(v/msum*100)}%${i===10?"*":""}</span></div><div class="mlab${i===curM?" now":""}">${monthName(i,"short")}</div></div>`;
  }).join("");
  const monthsEl=document.getElementById("months");
  monthsEl.onclick=e=>{const c=e.target.closest(".mcol"); for(const x of monthsEl.children) x.classList.toggle("show",x===c&&!c.classList.contains("show"));};
  const peakNames=sorted.slice(0,3).map(x=>x.i).sort((a,b)=>a-b).map(i=>monthName(i,"long"));
  const quiet=[...Array(12).keys()].filter(i=>m[i]<mmax*0.15).map(i=>monthName(i,"short"));
  const ratio=m[curM]/mmax;
  const nowMsg = ratio>=0.7 ? t("nowBusy") : ratio>=0.35 ? t("nowRamp") : t("nowQuiet");
  const listFmt=a=>{try{return new Intl.ListFormat(LOC(),{type:"conjunction"}).format(a)}catch(e){return a.join(", ")}};
  document.getElementById("seasonText").innerHTML=fill(t("seasonTop"),{lang:lname,months:listFmt(peakNames)})+(quiet.length?fill(t("seasonQuiet"),{q:listFmt(quiet)}):"")+" "+nowMsg;

  // lead time
  const ld=DATA.lead[L.id]; const sl=t("segs");
  const seg=[{k:sl[0],v:ld.lt36,c:"var(--ta-orange)"},{k:sl[1],v:ld.lt72-ld.lt36,c:"var(--accent)"},{k:sl[2],v:ld.lt7d-ld.lt72,c:"color-mix(in srgb, var(--accent) 60%, var(--ta-navy))"},{k:sl[3],v:1-ld.lt7d,c:"var(--ta-navy)"}];
  document.getElementById("leadbar").innerHTML=seg.map(s=>`<div style="width:${(s.v*100).toFixed(1)}%;background:${s.c}" title="${s.k}: ${Math.round(s.v*100)}%">${s.v>=0.1?Math.round(s.v*100)+"%":""}</div>`).join("");
  document.getElementById("lkey").innerHTML=seg.map(s=>`<span><i style="background:${s.c}"></i>${s.k} · ${s.v===0?"0":s.v<0.01?"<1":Math.round(s.v*100)}%</span>`).join("");
  const dys=Math.round(ld.medH/24*2)/2;
  document.getElementById("medDays").textContent=fill(t("days"),{n:dys.toLocaleString(LOC())});
  document.getElementById("leadText").innerHTML=fill(t(ld.lt36<0.01?"leadNone":"leadText"),{p:Math.max(1,Math.round(ld.lt36*100))+"%",lang:lname,q:Math.round((1-ld.lt7d)*100)});

  document.getElementById("source").textContent=fill(t("source"),{lang:lname});
}
buildChips(); buildTz(); render();
</script>
</body>
</html>
